<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>OnboardAI | Quản lý Nhân sự</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Sửa đường dẫn CSS lùi lại một cấp -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo-brand"><i class="fa-solid fa-sparkles"></i> OnboardAI</div>
            <a href="hr-dashboard.html" class="nav-link-custom"><i class="fa-solid fa-chart-pie"></i> Báo cáo tổng quan</a>
            <a href="hr-employees.html" class="nav-link-custom active"><i class="fa-solid fa-users"></i> Quản lý nhân viên</a>
            <a href="hr-journeys.html" class="nav-link-custom"><i class="fa-solid fa-route"></i> Quy trình hội nhập</a>
            <a href="#" class="nav-link-custom"><i class="fa-solid fa-gear"></i> Cài đặt hệ thống</a>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold">Danh sách nhân sự mới</h3>
                <button class="btn btn-primary" style="background-color: var(--primary); border:none;"><i class="fa-solid fa-plus"></i> Thêm nhân sự mới</button>
            </div>

            <!-- Filter Card -->
            <div class="card-custom mb-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="search-input" class="form-control" placeholder="🔍 Tìm kiếm nhân viên theo tên hoặc email...">
                    </div>
                    <div class="col-md-4">
                        <select id="dept-filter" class="form-select">
                            <option value="">Tất cả phòng ban</option>
                            <option value="IT">Kỹ thuật (IT)</option>
                            <option value="HR">Nhân sự (HR)</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Employee List Table -->
            <div class="card-custom">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Họ và tên</th>
                            <th>Phòng ban</th>
                            <th>Mentor phụ trách</th>
                            <th>Ngày gia nhập</th>
                            <th>Tiến độ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <!-- Data được render từ JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="../js/hr-main.js"></script>
</body>
</html>
